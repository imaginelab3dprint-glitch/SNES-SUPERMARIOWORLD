    <title>SNES NFC</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: #000;
            overflow: hidden;
        }
        #game {
            width: 100%;
            height: 100%;
        }
    </style>
    <script>
        EJS_player = "#game";

        EJS_startOnLoaded = true;

        EJS_language = "es-419";

</html>
